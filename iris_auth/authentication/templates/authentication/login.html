{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Django App</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="login-body">
    <header class="header">
        <h1>Welcome to the Iris Authentication System</h1>
    </header>

    <div class="login-container">
        <h2>Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" enctype="multipart/form-data" class="login-form" id="loginForm">
            {% csrf_token %}
            <label for="iris_image">Upload Iris Image:</label>
            <input type="file" name="iris_image" id="iris_image" class="file-input" required onchange="previewImage(event)">
            <img id="image_preview" class="image-preview" src="#" alt="Your Image" style="display: none;">
            <button type="button" id="remove-btn" class="remove-btn" style="display: none;" onclick="removeImage()">Remove Image</button>
            <button type="submit" class="submit-btn" id="login-btn">Login</button>
        </form>
    </div>

    <!-- Modal Popup -->
    <div id="statusModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Image Processing Status</h3>
            <p id="status-message">Starting...</p>
            <p id="confidence-percentage" style="display: none;">Confidence: <span id="confidence-value"></span>%</p>
            <button onclick="closeModal()" class="close-btn">Close</button>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Iris Authentication System. All rights reserved.</p>
    </footer>

    <script>
        // Preview the selected image
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('image_preview');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('remove-btn').style.display = 'inline';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Remove the selected image
        function removeImage() {
            document.getElementById('iris_image').value = '';
            document.getElementById('image_preview').style.display = 'none';
            document.getElementById('remove-btn').style.display = 'none';
        }

        // Open and close the modal
        function openModal() {
            document.getElementById("statusModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("statusModal").style.display = "none";
        }

        // Handle form submission and status updates
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            openModal();  // Open the modal on form submission

            var formData = new FormData(this);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '{% url "login" %}', true);

            // Show upload progress
            xhr.upload.onprogress = function() {
                document.getElementById('status-message').innerText = 'Uploading Image...';
            };

            // Handle the response
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);

                    // Update status based on the backend response
                    if (response.status === 'preprocessing') {
                        document.getElementById('status-message').innerText = 'Preprocessing Image...';
                    } else if (response.status === 'predicted') {
                        document.getElementById('status-message').innerText = 'Prediction Complete!';
                        document.getElementById('confidence-percentage').style.display = 'block';
                        document.getElementById('confidence-value').innerText = response.confidence;
                    } else if (response.status === 'login_success') {
                        document.getElementById('status-message').innerText = 'Login Successful!';
                        setTimeout(function() {
                            window.location.href = response.redirect_url;
                        }, 2000);  // Redirect after 2 seconds
                    } else if (response.status === 'error') {
                        document.getElementById('status-message').innerText = 'Error: ' + response.error;
                    }
                }
            };

            xhr.send(formData);  // Send the form data
        });
    </script>
</body>
</html>
