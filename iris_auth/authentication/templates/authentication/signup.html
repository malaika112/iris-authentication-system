<!-- signup.html -->
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Iris Authentication</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="signup-container">
        <h1>Create an Account</h1>
        
        <form method="post" enctype="multipart/form-data" action="{% url 'signup' %}" class="signup-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="iris_image">Upload Iris Image</label>
                {{ form.iris_image }}
            </div>

            <div class="form-group">
                <label for="password1">Password</label>
                {{ form.password1 }}  <!-- Adding password1 field -->
            </div>

            <div class="form-group">
                <label for="password2">Confirm Password</label>
                {{ form.password2 }}  <!-- Adding password2 field -->
            </div>

            <div class="form-group">
                <button type="submit" class="btn-submit">Sign Up</button>
            </div>
        </form>

        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
